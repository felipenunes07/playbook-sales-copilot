<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Chamada de vídeo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root { --bg: #0e1117; --panel: #161b22; --border: #2a3140; --text: #e6e9ef; --muted: #8b95a7; --accent: #6ea8fe; --bad: #ff5c5c;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  .stage { position: fixed; inset: 0; background: #000; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #local { position: absolute; right: 16px; top: 16px; width: 28vw; max-width: 220px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 2px solid var(--border); background: #111; transform: scaleX(-1); }
  .status { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); font-size: 17px; padding: 0 16px; width: 100%; max-width: 440px; }
  .status b { color: var(--text); display: block; font-size: 22px; margin-bottom: 8px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 14px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #000c); }
  button { border: 0; border-radius: 999px; padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer; background: #2a3140; color: var(--text); transition: background .15s; }
  button:hover { background: #343d50; }
  button.off { background: #ff5c5c33; color: var(--bad); }
  button.primary { background: var(--accent); color: #0b0f16; font-size: 17px; padding: 16px 28px; }
  button.leave { background: var(--bad); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="stage">
  <video id="remote" autoplay playsinline></video>
  <video id="local" class="hidden" autoplay playsinline muted></video>
  <div class="status" id="status"><b>Chamada de vídeo</b>Toque em <i>Entrar</i> e permita câmera e microfone.<br /><br /><button class="primary" id="join">Entrar na chamada</button></div>
  <div class="bar hidden" id="bar">
    <button id="mic">🎙 Microfone</button>
    <button id="cam">📷 Câmera</button>
    <button class="leave" id="leave">Sair</button>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const room = location.pathname.split('/').filter(Boolean).pop();
  let ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }];
  let pc = null, local = null, left = false, timer = null, mode = 'server', peer = null, media = null;

  // Free transcription of the guest's own voice with Chrome's speech recognition. Only the text goes to the rep's
  // copilot, over a data channel of the call. Phones are left out: there the recognizer competes with the call for the mic.
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  let rec = null, sttOn = false, sttOk = false, dc = null, dataFor = null, loudAt = 0, meter = null, meterCtx = null;
  function sendText(m) {
    if (!dc) return;
    try {
      if (dc.readyState === 'open') dc.send(JSON.stringify(m));  // RTCDataChannel
      else if (dc.open === true) dc.send(m);                     // PeerJS DataConnection
    } catch (_) {}
  }
  function attachChannel(ch) {
    dc = ch;
    const hello = () => { if (dc === ch) sendText({ type: 'stt-status', ok: sttOk }); };
    if (ch.readyState === 'open' || ch.open === true) hello();
    if (ch.on) ch.on('open', hello); else ch.onopen = hello;
  }
  // The recognizer opens the mic without echo cancellation, so it may also hear the rep through the speakers:
  // only send text while the echo-cancelled call mic shows the guest's own voice.
  function startMeter() {
    meterCtx = new AudioContext();
    const an = meterCtx.createAnalyser(); an.fftSize = 1024;
    meterCtx.createMediaStreamSource(local).connect(an);  // not connected to the speakers: silent
    const buf = new Float32Array(an.fftSize);
    meter = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      if (Math.sqrt(sum / buf.length) > 0.012) loudAt = Date.now();
    }, 100);
  }
  const talking = () => Date.now() - loudAt < 3000;
  function startSTT() {
    if (!SpeechRec || MOBILE || rec) return;
    const r = rec = new SpeechRec(); r.continuous = true; r.interimResults = true; r.lang = 'pt-BR';
    let fails = 0;
    r.onstart = () => { sttOk = true; sendText({ type: 'stt-status', ok: true }); };
    r.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) { fails = 0; const text = res[0].transcript.trim(); if (text && talking()) sendText({ type: 'stt', text, final: true }); }
        else interim += res[0].transcript;
      }
      if (interim && talking()) sendText({ type: 'stt', text: interim, final: false });
    };
    r.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (++fails >= 3 || /not-allowed/.test(e.error)) { stopSTT(); sttOk = false; sendText({ type: 'stt-status', ok: false }); }
    };
    r.onend = () => { if (rec === r && sttOn) { try { r.start(); } catch (_) {} } };
    sttOn = true;
    try { r.start(); } catch (_) {}
  }
  function stopSTT() {
    sttOn = false;
    const r = rec; rec = null;
    if (r) { r.onend = null; try { r.abort(); } catch (_) {} }
  }

  const status = (title, text) => { $('status').classList.remove('hidden'); $('status').innerHTML = `<b>${title}</b>${text || ''}`; };
  const hideStatus = () => $('status').classList.add('hidden');
  // signaling through the server over plain HTTP (post + poll)
  const send = (m, keepalive = false) => fetch(`/sala/${room}/send?role=guest`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(m), keepalive }).catch(() => {});

  function newPeer() {
    if (pc) pc.close();
    pc = new RTCPeerConnection({ iceServers: ICE });
    pc.ondatachannel = (e) => attachChannel(e.channel);
    local.getTracks().forEach(t => pc.addTrack(t, local));
    pc.onicecandidate = (e) => send({ type: 'ice', candidate: e.candidate });
    pc.ontrack = (e) => { if ($('remote').srcObject !== e.streams[0]) $('remote').srcObject = e.streams[0]; hideStatus(); };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') status('Não foi possível conectar', 'A rede bloqueou a conexão de vídeo. Tente outra rede (por exemplo, os dados do celular).');
    };
  }

  async function onSignal(m) {
      if (m.type === 'offer') {
        newPeer();
        await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ type: 'answer', sdp: answer.sdp });
      } else if (m.type === 'ice' && pc) {
        try { await pc.addIceCandidate(m.candidate || null); } catch (_) {}
      } else if (m.type === 'peer-joined') {
        status('Conectando…');
      } else if (m.type === 'peer-left' || m.type === 'bye') {
        if (pc) { pc.close(); pc = null; }
        $('remote').srcObject = null;
        status('Aguardando…', 'A outra pessoa saiu da chamada. Ela pode voltar a qualquer momento.');
      }
  }

  async function poll() {
    if (left) return;
    try {
      const r = await fetch(`/sala/${room}/poll?role=guest`);
      if (r.status === 404) { status('Sala não encontrada', 'Este link expirou. Peça um novo link.'); return; }
      if (r.ok) for (const m of await r.json()) await onSignal(m);
    } catch (_) {}
    timer = setTimeout(poll, 700);
  }

  // Without a shared queue on serverless hosts, call setup goes through the public PeerJS broker (it also brings TURN).
  const hostId = 'pbl-' + room.replace(/[^A-Za-z0-9]/g, '');
  function loadPeerJS() {
    if (window.Peer) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
      s.onload = res; s.onerror = () => rej(new Error('PeerJS')); document.head.appendChild(s);
    });
  }
  function callHost() {
    if (left || !peer || peer.destroyed) return;
    if (media) media.close();
    const mc = media = peer.call(hostId, local);
    if (!mc) { timer = setTimeout(callHost, 2000); return; }
    mc.on('stream', (stream) => {
      if ($('remote').srcObject !== stream) $('remote').srcObject = stream; hideStatus();
      if (dataFor !== mc) { dataFor = mc; attachChannel(peer.connect(hostId, { reliable: true })); }  // text channel to the rep
    });
    mc.on('close', () => {
      if (left || media !== mc) return;
      $('remote').srcObject = null;
      status('Aguardando…', 'A outra pessoa saiu da chamada. Ela pode voltar a qualquer momento.');
      timer = setTimeout(callHost, 2000);
    });
    const watch = () => {
      if (!mc.peerConnection) return setTimeout(watch, 200);
      mc.peerConnection.addEventListener('connectionstatechange', () => {
        if (mc.peerConnection.connectionState === 'failed') status('Não foi possível conectar', 'A rede bloqueou a conexão de vídeo. Tente outra rede (por exemplo, os dados do celular).');
      });
    };
    watch();
  }
  async function connectPeerJS() {
    await loadPeerJS();
    peer = new Peer();
    peer.on('open', callHost);
    peer.on('error', (e) => {
      if (left) return;
      if (e.type === 'peer-unavailable') { status('Aguardando…', 'Você entrou. A chamada começa assim que a outra pessoa estiver na sala.'); timer = setTimeout(callHost, 2000); }
      else status('Não foi possível conectar', 'Recarregue a página para tentar de novo.');
    });
    peer.on('disconnected', () => { if (!left) peer.reconnect(); });
  }

  async function connect() {
    try {
      const r = await fetch(`/sala/${room}/config`);
      if (r.status === 404) { status('Sala não encontrada', 'Este link expirou. Peça um novo link.'); return; }
      if (r.ok) { const c = await r.json(); ICE = c.ice || ICE; mode = c.signaling || 'server'; }
    } catch (_) {}
    if (mode === 'peerjs') {
      try { await connectPeerJS(); } catch (_) { status('Não foi possível conectar', 'Recarregue a página para tentar de novo.'); }
      return;
    }
    await send({ type: 'peer-joined' });
    poll();
  }

  $('join').onclick = async () => {
    try {
      local = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      status('Sem acesso à câmera ou ao microfone', 'Permita o acesso nas configurações do navegador e recarregue a página.');
      return;
    }
    $('local').srcObject = local; $('local').classList.remove('hidden'); $('bar').classList.remove('hidden');
    try { startMeter(); } catch (_) {}
    startSTT();
    status('Aguardando…', 'Você entrou. A chamada começa assim que a outra pessoa estiver na sala.');
    connect();
  };
  const toggle = (kind, btn) => () => {
    const t = local.getTracks().find(x => x.kind === kind); t.enabled = !t.enabled; $(btn).classList.toggle('off', !t.enabled);
    if (kind === 'audio') { if (t.enabled) startSTT(); else stopSTT(); }  // the recognizer has its own mic: stop it too
  };
  $('mic').onclick = toggle('audio', 'mic');
  $('cam').onclick = toggle('video', 'cam');
  window.addEventListener('beforeunload', () => { if (local && !left && mode === 'server') send({ type: 'bye' }, true); if (peer) peer.destroy(); });
  $('leave').onclick = () => {
    left = true; clearTimeout(timer);
    if (mode === 'server') send({ type: 'bye' }, true);
    if (media) media.close(); if (peer) peer.destroy();
    stopSTT(); clearInterval(meter); if (meterCtx) meterCtx.close();
    if (pc) pc.close(); local.getTracks().forEach(t => t.stop());
    $('bar').classList.add('hidden'); $('local').classList.add('hidden'); $('remote').srcObject = null;
    status('Você saiu da chamada', 'Pode fechar esta página.');
  };
})();
</script>
</body>
</html>
